# pnpm 10 默认禁止依赖的 install 脚本（postinstall 等），需在此显式声明。
# - onlyBuiltDependencies：批准运行构建脚本的包（确有需要的）。
# - ignoredBuiltDependencies：明确不运行其脚本的包（无需构建的）。
#   两类合起来覆盖所有被 pnpm 标记的包，install 才会正常退出。
onlyBuiltDependencies:
  - esbuild # 需 postinstall 下载/解压平台二进制，不批准则构建失败
  - vue-demi # 需 postinstall 切换到对应 Vue 版本，不批准会导致 shim 失效
ignoredBuiltDependencies:
  - spawn-sync # node <0.12 的遗留 fallback，现代 node 无需构建
allowBuilds:
  esbuild: true
  spawn-sync: true
  vue-demi: true
